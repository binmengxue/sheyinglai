# 本地开发用 MySQL：docker compose up -d
# 对应 server 的 dev profile（root / 123456，库名 photo）
services:
  mysql:
    image: mysql:8.0
    container_name: photo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: photo
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
