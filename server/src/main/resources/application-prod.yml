# 服务器配置：敏感信息全部走环境变量（写在 /srv/photo/photo.env，见 deploy/README）
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/photo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:photo}
    password: ${DB_PASSWORD}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      dir: /srv/photo/uploads
    oss:
      endpoint: ${OSS_ENDPOINT:}
      bucket: ${OSS_BUCKET:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      domain: ${OSS_DOMAIN:}

logging:
  file:
    name: /srv/photo/logs/app.log
