# http 和 IP 访问统一跳转到 https://sheyinglai.top
server {
    listen 80;
    server_name sheyinglai.top www.sheyinglai.top 106.14.171.234;
    return 301 https://sheyinglai.top$request_uri;
}

# www 跳转到主域名
server {
    listen 443 ssl;
    server_name www.sheyinglai.top;
    ssl_certificate     /etc/nginx/cert/www.sheyinglai.top.pem;
    ssl_certificate_key /etc/nginx/cert/www.sheyinglai.top.key;
    return 301 https://sheyinglai.top$request_uri;
}

# 主站
server {
    listen 443 ssl;
    server_name sheyinglai.top;
    ssl_certificate     /etc/nginx/cert/sheyinglai.top.pem;
    ssl_certificate_key /etc/nginx/cert/sheyinglai.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 60m;

    root /var/www/photo;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/files/ {
        alias /srv/photo/uploads/;
        expires 30d;
    }

    # ===== 测试环境：https://sheyinglai.top/api-dev/ =====
    # 独立后端进程（8081）+ 独立数据库 + 独立图片目录，本地开发用 `pnpm dev:test` 直连这里
    location /api-dev/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api-dev/files/ {
        alias /srv/photo-dev/uploads/;
        expires 30d;
    }
}
