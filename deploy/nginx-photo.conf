# 登录、注册接口限流：每个 IP 每秒 2 次，突发 10 次（应用里还有按手机号的限制）
limit_req_zone $binary_remote_addr zone=photo_auth:10m rate=2r/s;
limit_req_status 429;

# http 和 IP 访问统一跳转到 https://sheyinglai.top
server {
    listen 80;
    server_name sheyinglai.top www.sheyinglai.top 106.14.171.234;
    return 301 https://sheyinglai.top$request_uri;
}

# www 跳转到主域名
server {
    listen 443 ssl;
    server_name www.sheyinglai.top;
    ssl_certificate     /etc/nginx/cert/www.sheyinglai.top.pem;
    ssl_certificate_key /etc/nginx/cert/www.sheyinglai.top.key;
    return 301 https://sheyinglai.top$request_uri;
}

# 主站
server {
    listen 443 ssl;
    server_name sheyinglai.top;
    ssl_certificate     /etc/nginx/cert/sheyinglai.top.pem;
    ssl_certificate_key /etc/nginx/cert/sheyinglai.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 应用只接受 1MB 的图片，留一点表单余量
    client_max_body_size 3m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # 安全响应头（always：错误页也带上）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/photo;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    # index.html 每次都校验，发布后用户立即拿到新版本（assets 文件名带 hash，可长期缓存）
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /api/auth/ {
        limit_req zone=photo_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 图片文件名是随机的，内容不会变，可长期缓存；nosniff 防止被当成网页执行
    location /api/files/ {
        alias /srv/photo/uploads/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ===== 测试环境：https://sheyinglai.top/api-dev/ =====
    # 独立后端进程（8081）+ 独立数据库和数据库账号 + 独立图片目录，本地开发用 `npm run test` 直连这里
    # 如果只有固定几个开发者使用，建议在这里加 allow <你的IP>; deny all; 只放行自己的 IP
    location /api-dev/auth/ {
        limit_req zone=photo_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-dev/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api-dev/files/ {
        alias /srv/photo-dev/uploads/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
