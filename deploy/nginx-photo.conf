# 放到 /etc/nginx/sites-available/photo，再软链到 sites-enabled
# 备案通过前用 IP 访问；备案通过后配置 HTTPS（见 README 第 5 步）
server {
    listen 80;
    server_name sheyinglai.top www.sheyinglai.top 106.14.171.234;

    client_max_body_size 2m;           # 和后端 multipart 的 max-request-size 保持一致

    # 前端：Vue 打包产物
    root /var/www/photo;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # 支持 Vue Router history 模式刷新
    }
    location /assets/ {
        expires 30d;                         # 打包文件名带 hash，可以长缓存
        add_header Cache-Control "public, immutable";
    }

    # 后端：Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;             # 大图上传留足时间
    }

    # 本地存储模式下，图片由 Nginx 直接读磁盘，比走 Java 快
    location /api/files/ {
        alias /srv/photo/uploads/;
        expires 30d;
    }
}
